<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Instant Study Flashcard Generator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <header>
      <h1>Flashcard Studio</h1>
      <p>Convert your textbook notes into digital flashcards instantly.</p>
    </header>

    <main class="container">
      <div class="input-section">
        <label for="note-input">Paste your notes (Format: <code>Term : Definition</code> on each line):</label>
        <textarea id="note-input" rows="8" placeholder="Refraction : Bending of light passing through different mediums&#10;Photosynthesis : Process used by plants to convert light into chemical energy&#10;Newton's First Law : An object remains at rest unless acted upon by a net force"></textarea>
        <button id="btn-generate" class="primary-btn">Generate Flashcards</button>
      </div>

      <div id="deck-section" class="deck-section">
        <h2>Your Study Deck (<span id="card-count">0</span>)</h2>
        <div id="card-grid" class="grid"></div>
      </div>
    </main>

    <footer>
      <p>Free open-source study tool • Check out my other tools: <a href="#">Resume Builder</a> | <a href="#">Bill Calculator</a></p>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
